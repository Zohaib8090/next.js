name: Build SWC for Android ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - android-swc-build

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NAPI_VERSION: 10
      RUST_BACKTRACE: 1

    steps:
      - name: Checkout Next.js
        uses: actions/checkout@v4
        with:
          repository: vercel/next.js
          ref: v16.1.6
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27
          add-to-path: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          npm install -g @napi-rs/cli

      - name: Build next-swc-napi
        env:
          CC_aarch64_linux_android: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CXX_aarch64_linux_android: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
          AR_aarch64_linux_android: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android: "--sysroot=${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
        run: |
          cd packages/next-swc
          npx napi build \
            --release \
            --target aarch64-linux-android \
            -p next-swc-napi \
            --features image-extended \
            --js false \
            --cargo-name next_swc_napi \
            --cargo-cwd ../../

      - name: Prepare Artifact
        run: |
          mkdir -p output
          cp packages/next-swc/*.node output/next-swc.android-arm64.node

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-swc-android-arm64
          path: output/next-swc.android-arm64.node
